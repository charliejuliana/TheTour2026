<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Golf Tour</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(135deg,#052e16,#0f172a);
  color: white;
}
header {
  background: rgba(2,6,23,0.95);
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #14532d;
}
header h2 {
  color: #4ade80;
  letter-spacing: 1px;
}
nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 6px;
}
nav a:hover {
  background: #14532d;
}
.section {
  display: none;
  padding: 20px;
}
.active {
  display: block;
}
.card {
  background: rgba(30,41,59,0.9);
  padding: 15px;
  border-radius: 12px;
  margin: 10px 0;
  border: 1px solid #1f2937;
}
button {
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #22c55e;
  color: black;
  font-weight: bold;
}
button:hover {
  background: #16a34a;
}
input {
  padding: 8px;
  margin: 5px 0;
  width: 100%;
  border-radius: 6px;
  border: none;
}
.player {
  display: flex;
  align-items: center;
  gap: 10px;
}
.player img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 2px solid #22c55e;
}
.table {
  width: 100%;
  border-collapse: collapse;
}
.table th, .table td {
  padding: 10px;
  border-bottom: 1px solid #334155;
  text-align: left;
}
.badge {
  background: #14532d;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 12px;
}
</style>
</head>
<body>
<header>
<h2>Mini Golf Tour</h2>
<nav>
<a onclick="show('home')">Home</a>
<a onclick="show('leaderboard')">Leaderboard</a>
<a onclick="show('players')">Players</a>
<a onclick="show('stats')">Stats</a>
<a onclick="show('tournaments')">Previous Tournaments</a>
<a onclick="show('admin')">Admin</a>
</nav>
</header>

<div id="home" class="section active">
<h1>Welcome to Mini Golf Tour</h1>
<p>Track tournaments, rankings, and stats like a pro tour.</p>
</div>

<div id="leaderboard" class="section">
<h1>Season Leaderboard</h1>
<div id="leaderboardList"></div>
</div>

<div id="players" class="section">
<h1>Players</h1>
<div id="playersList"></div>
</div>

<div id="stats" class="section">
<h1>Stats</h1>
<p>Coming soon</p>
</div>

<div id="tournaments" class="section">
<h1>Previous Tournaments</h1>
<div id="tournamentList"></div>
</div>

<div id="tournamentDetail" class="section">
<button onclick="show('tournaments')">← Back</button>
<h1 id="detailTitle"></h1>
<p id="detailInfo"></p>
<table class="table">
<thead><tr><th>Pos</th><th>Player</th><th>Score</th></tr></thead>
<tbody id="detailTable"></tbody>
</table>
</div>

<div id="admin" class="section">
<h1>Admin</h1>
<input type="password" id="password" placeholder="Enter password">
<button onclick="unlock()">Unlock</button>

<div id="adminPanel" style="display:none;">
<h2>Add Tournament</h2>
<input id="name" placeholder="Tournament Name">
<input id="date" placeholder="Date">
<input id="location" placeholder="Location">
<input id="holes" placeholder="Number of Holes">
<h3>Scores (Relative to Par)</h3>
<div id="scores"></div>
<button onclick="addTournament()">Submit</button>
</div>
</div>

<script>
// ---------------- STORAGE ----------------
let players = JSON.parse(localStorage.getItem('mg_players')) || [
{name:"Charlie Juliana", points:0, img:"charlieminigolf.png"},
{name:"Caleb Willner", points:0, img:"https://via.placeholder.com/50"},
{name:"Devin Skinner", points:0, img:"Charlielikesboys .pdf"},
{name:"Isaac Baranski", points:0, img:"tuffAhhIsaac.pdf"},
{name:"Peter Merk", points:0, img:"Charlie is good boy.pdf"},
{name:"Avery Radom", points:0, img:"https://via.placeholder.com/50"}
];

let tournaments = JSON.parse(localStorage.getItem('mg_tournaments')) || [];

function saveData(){
 localStorage.setItem('mg_players', JSON.stringify(players));
 localStorage.setItem('mg_tournaments', JSON.stringify(tournaments));
}

// ---------------- NAV ----------------
function show(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 updateLeaderboard();
 renderPlayers();
 renderTournaments();
}

// ---------------- RENDER ----------------
function renderPlayers(){
 const div = document.getElementById('playersList');
 div.innerHTML='';
 players.forEach(p=>{
 div.innerHTML += `<div class='card player'><img src='${p.img}'><span>${p.name}</span></div>`;
 });
}

function updateLeaderboard(){
 const sorted = [...players].sort((a,b)=>b.points-a.points);
 const div = document.getElementById('leaderboardList');
 div.innerHTML='';
 sorted.forEach((p,i)=>{
 div.innerHTML += `<div class='card'>#${i+1} ${p.name} <span class='badge'>${p.points} pts</span></div>`;
 });
}

function renderTournaments(){
 const div = document.getElementById('tournamentList');
 div.innerHTML='';
 tournaments.forEach((t,i)=>{
 div.innerHTML += `<div class='card'><h3>${t.name}</h3><p>${t.date} | ${t.location}</p><button onclick='openTournament(${i})'>View Leaderboard</button></div>`;
 });
}

// ---------------- TOURNAMENT DETAIL ----------------
function openTournament(index){
 const t = tournaments[index];
 show('tournamentDetail');
 document.getElementById('detailTitle').innerText = t.name;
 document.getElementById('detailInfo').innerText = `${t.date} | ${t.location} | ${t.holes} holes`;

 const table = document.getElementById('detailTable');
 table.innerHTML='';

 t.results.forEach((r,i)=>{
   let label = (i>0 && t.results[i].score === t.results[i-1].score) ? `T-${r.place}` : `${r.place}`;
   table.innerHTML += `<tr><td>${label}</td><td>${r.name}</td><td>${r.score}</td></tr>`;
 });
}

// ---------------- ADMIN ----------------
function unlock(){
 if(document.getElementById('password').value === "TheTour2026"){
 document.getElementById('adminPanel').style.display='block';
 initScores();
 }
}

function initScores(){
 const div = document.getElementById('scores');
 div.innerHTML='';
 players.forEach((p,i)=>{
 div.innerHTML += `${p.name}: <input type='number' id='score${i}' placeholder='DNP'><br>`;
 });
}

// ---------------- ADD TOURNAMENT ----------------
function addTournament(){
 let results = [];

 players.forEach((p,i)=>{
 let val = document.getElementById(`score${i}`).value;
 if(val!=="") results.push({name:p.name, score:parseInt(val)});
 });

 results.sort((a,b)=>a.score-b.score);

 // assign places with ties
 let places = [];
 let place = 1;
 for(let i=0;i<results.length;i++){
 if(i>0 && results[i].score === results[i-1].score){
 places[i] = places[i-1];
 } else {
 places[i] = place;
 }
 place++;
 }

 function getPoints(p){
 if(p===1) return 4;
 if(p===2) return 3;
 if(p===3) return 2;
 if(p===4) return 1;
 return 0;
 }

 results.forEach((r,i)=>{
 let pts = getPoints(places[i]);
 let player = players.find(x=>x.name===r.name);
 player.points += pts;
 });

 tournaments.push({
 name: document.getElementById('name').value,
 date: document.getElementById('date').value,
 location: document.getElementById('location').value,
 holes: document.getElementById('holes').value,
 results: results.map((r,i)=>({...r, place: places[i]}))
 });

 saveData();
 alert('Tournament Added');
 updateLeaderboard();
 renderTournaments();
}

show('home');
</script>
</body>
</html>
