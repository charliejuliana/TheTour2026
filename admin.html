<body>
<header>
<h2>Admin</h2>
<nav>

</nav>

<div class="card">
<input type="password" id="password" placeholder="Enter password">
<button onclick="unlock()">Unlock</button>

<div id="adminPanel" style="display:none;">
<h2>Add Tournament</h2>
<input id="name" placeholder="Tournament Name">
<input id="date" placeholder="Date">
<input id="location" placeholder="Location">
<input id="holes" placeholder="Holes">

<h3>Scores</h3>
<div id="scores"></div>

<button onclick="addTournament()">Submit</button>
</div>
</div>

  <hr>
<h3>Reset Leaderboard</h3>
<button onclick="resetLeaderboard()" style="background:#ef4444;color:white;">
  Reset Leaderboard
</button>

  <hr>
<h3>Undo Last Tournament</h3>
<button onclick="undoLastTournament()" style="background:#f59e0b;color:black;">
  Undo Last Tournament
</button>
